<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Bank ATM</title>
    <style>
        /* ตั้งค่าพื้นหลังและฟอนต์ */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* ตกแต่งกรอบหน้าจอ ATM */
        .atm-container {
            background-color: #1e1e1e;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 255, 255, 0.15);
            text-align: center;
            width: 320px;
            border: 2px solid #00ffff;
        }

        h2 {
            color: #00ffff;
            margin-top: 0;
            letter-spacing: 2px;
        }

        hr {
            border: 0;
            height: 1px;
            background: #00ffff;
            margin-bottom: 20px;
        }

        /* ตกแต่งช่องใส่รหัส */
        input[type="password"] {
            width: 80%;
            padding: 12px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 10px;
            border-radius: 6px;
            border: 2px solid #555;
            background-color: #2c2c2c;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }

        input[type="password"]:focus {
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        /* ตกแต่งปุ่มกด */
        button {
            margin-top: 20px;
            width: 90%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #121212;
            background-color: #00ffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #00cccc;
        }

        button:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        /* ตกแต่งข้อความแสดงสถานะ */
        .message {
            margin-top: 20px;
            min-height: 40px;
            font-size: 14px;
            font-weight: bold;
        }

        .success { color: #00ff00; }
        .error { color: #ff4c4c; }
        .warning { color: #ffcc00; }
        .loading { color: #00ffff; }
    </style>
</head>
<body>

    <div class="atm-container">
        <h2>🌟 WEB BANK ATM 🌟</h2>
        <hr>
        
        <p>Please enter your 4-digit PIN</p>
        <!-- ช่องใส่รหัส รับแค่ 4 ตัว -->
        <input type="password" id="pinInput" maxlength="4" placeholder="****">
        
        <button id="submitBtn" onclick="checkPin()">Enter</button>
        
        <!-- พื้นที่แสดงข้อความแจ้งเตือน -->
        <div class="message" id="messageDisplay"></div>
    </div>

    <script>
        // ตั้งค่าตัวแปรระบบ
        const correctPin = "1234";
        const maxAttempts = 3;
        let currentAttempts = 0;
        let isUnlocked = false;

        // ดึง Element จาก HTML มาใช้งาน
        const pinInput = document.getElementById("pinInput");
        const submitBtn = document.getElementById("submitBtn");
        const messageDisplay = document.getElementById("messageDisplay");

        function checkPin() {
            if (isUnlocked || currentAttempts >= maxAttempts) return;

            const userPin = pinInput.value;

            // เช็คว่ากรอกครบ 4 ตัวหรือไม่
            if (userPin.length < 4) {
                showMessage("Please enter all 4 digits.", "warning");
                return;
            }

            // แสดงสถานะกำลังโหลด พร้อมล็อกปุ่มและช่องพิมพ์ชั่วคราว
            showMessage("⏳ Verifying...", "loading");
            pinInput.disabled = true;
            submitBtn.disabled = true;

            // หน่วงเวลา 1.2 วินาที (เหมือน time.sleep ใน Python)
            setTimeout(() => {
                if (userPin === correctPin) {
                    isUnlocked = true;
                    showMessage("✅ Login Successful!<br>Welcome to your account.", "success");
                    // ผ่านแล้วให้ล็อกช่องพิมพ์ถาวร
                    pinInput.value = "";
                } else {
                    currentAttempts++;
                    let attemptsLeft = maxAttempts - currentAttempts;
                    
                    if (attemptsLeft > 0) {
                        showMessage(`❌ Incorrect PIN.<br>You have ${attemptsLeft} attempts left.`, "error");
                        pinInput.disabled = false;
                        submitBtn.disabled = false;
                        pinInput.value = ""; // ล้างช่องรหัสให้พิมพ์ใหม่
                        pinInput.focus();
                    } else {
                        showMessage("🚨 ACCOUNT LOCKED!<br>Maximum attempts exceeded.", "error");
                    }
                }
            }, 1200);
        }

        // ให้สามารถกดปุ่ม Enter บนคีย์บอร์ดแทนการคลิกปุ่มได้
        pinInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                submitBtn.click();
            }
        });

        // ฟังก์ชันช่วยแสดงข้อความและเปลี่ยนสี
        function showMessage(text, className) {
            messageDisplay.innerHTML = text;
            messageDisplay.className = "message " + className;
        }
    </script>

</body>
</html>
